        const ahora = new Date();

        const diaGuate = ahora.getDay(); // 0: Domingo, 1: Lunes...

        let estado = "Cerrado";
        let color = "#f87171"; // Rojo

        // Lunes a Viernes (8:00 a 18:00)
        if (diaGuate >= 1 && diaGuate <= 5) {
          if (horaGuate >= 8 && horaGuate < 18) {
            estado = "Abierto";
            color = "#4ade80"; // Verde
          }
        } 
        // Sábados (8:00 a 12:00)
        else if (diaGuate === 6) {
          if (horaGuate >= 8 && horaGuate < 12) {
            estado = "Abierto";
            color = "#4ade80";
          }
        }

        const el = document.getElementById("estado-horario");
        if (el) {
          el.innerHTML = estado;
          el.style.color = color;
          el.style.fontWeight = "bold";
        }
      }

      // Ejecutar al cargar y cada minuto por si cambia la hora mientras ven la web
      window.onload = actualizarEstadoHorario;
      setInterval(actualizarEstadoHorario, 60000);
